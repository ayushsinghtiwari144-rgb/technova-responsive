<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgGrad3)"/>

  <!-- E-commerce Storefront Mockup -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="480" height="320" rx="16" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
    <!-- Store Header -->
    <rect x="0" y="0" width="480" height="50" rx="16" fill="#1e1b4b"/>
    <rect x="20" y="18" width="100" height="14" rx="4" fill="url(#orangeGrad)"/>
    <rect x="360" y="15" width="100" height="22" rx="6" fill="#8b5cf6"/>
    <text x="410" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cart (3)</text>

    <!-- Product Grid Mockup -->
    <!-- Product 1 -->
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="130" height="220" rx="10" fill="#1e293b"/>
      <rect x="10" y="10" width="110" height="100" rx="8" fill="#334155"/>
      <!-- Product Icon -->
      <circle cx="65" cy="60" r="25" fill="#f97316" opacity="0.8"/>
      <rect x="15" y="125" width="80" height="10" rx="3" fill="#cbd5e1"/>
      <rect x="15" y="145" width="50" height="12" rx="3" fill="#38bdf8"/>
      <rect x="15" y="175" width="100" height="30" rx="6" fill="url(#orangeGrad)"/>
      <text x="65" y="194" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Buy Now</text>
    </g>

    <!-- Product 2 -->
    <g transform="translate(175, 70)">
      <rect x="0" y="0" width="130" height="220" rx="10" fill="#1e293b"/>
      <rect x="10" y="10" width="110" height="100" rx="8" fill="#334155"/>
      <circle cx="65" cy="60" r="25" fill="#ec4899" opacity="0.8"/>
      <rect x="15" y="125" width="80" height="10" rx="3" fill="#cbd5e1"/>
      <rect x="15" y="145" width="50" height="12" rx="3" fill="#38bdf8"/>
      <rect x="15" y="175" width="100" height="30" rx="6" fill="url(#orangeGrad)"/>
      <text x="65" y="194" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Buy Now</text>
    </g>

    <!-- Product 3 -->
    <g transform="translate(330, 70)">
      <rect x="0" y="0" width="130" height="220" rx="10" fill="#1e293b"/>
      <rect x="10" y="10" width="110" height="100" rx="8" fill="#334155"/>
      <circle cx="65" cy="60" r="25" fill="#a855f7" opacity="0.8"/>
      <rect x="15" y="125" width="80" height="10" rx="3" fill="#cbd5e1"/>
      <rect x="15" y="145" width="50" height="12" rx="3" fill="#38bdf8"/>
      <rect x="15" y="175" width="100" height="30" rx="6" fill="url(#orangeGrad)"/>
      <text x="65" y="194" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Buy Now</text>
    </g>
  </g>
</svg>
