<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="20" fill="url(#aboutGrad)"/>

  <!-- Network Connection Nodes -->
  <g opacity="0.3" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6">
    <line x1="150" y1="120" x2="300" y2="80"/>
    <line x1="300" y1="80" x2="450" y2="120"/>
    <line x1="150" y1="120" x2="220" y2="280"/>
    <line x1="450" y1="120" x2="380" y2="280"/>
    <line x1="220" y1="280" x2="380" y2="280"/>
  </g>

  <!-- Central Hub Circle -->
  <circle cx="300" cy="180" r="70" fill="url(#tealGrad)" opacity="0.9"/>
  <circle cx="300" cy="180" r="90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8,4"/>
  <!-- Tech Icon in Center -->
  <path d="M280 170 L300 150 L320 170 M300 150 L300 205 M280 195 L300 215 L320 195" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Surrounding Feature Nodes -->
  <!-- Node 1: Web -->
  <g transform="translate(150, 120)">
    <circle cx="0" cy="0" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="5" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Node 2: Mobile -->
  <g transform="translate(450, 120)">
    <circle cx="0" cy="0" r="32" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="5" fill="#a855f7" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">📱</text>
  </g>

  <!-- Node 3: Cloud -->
  <g transform="translate(220, 280)">
    <circle cx="0" cy="0" r="32" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="0" y="5" fill="#6366f1" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">☁️</text>
  </g>

  <!-- Node 4: UI/UX -->
  <g transform="translate(380, 280)">
    <circle cx="0" cy="0" r="32" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="0" y="5" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🎨</text>
  </g>

  <!-- Floating Stats Card in Visual -->
  <g transform="translate(150, 340)">
    <rect x="0" y="0" width="300" height="70" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="150" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Driven by Innovation &amp; Excellence</text>
    <text x="150" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Crafting digital solutions for modern businesses</text>
  </g>
</svg>
